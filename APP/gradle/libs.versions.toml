[versions]
agp = "9.3.2"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
material = "1.14.0"
activityKtx = "1.13.0"
constraintlayout = "2.2.2"
# --- 팀 프로젝트 추가 ---
lifecycle = "2.9.2"
coroutines = "1.9.0"
retrofit = "2.11.0"
okhttpLogging = "4.12.0"
# --- Compose ---
# AGP 9.3.2 가 내장한 Kotlin 버전. `gradlew buildEnvironment` 의 kotlin-stdlib
# 해결 결과로 확인했다. Compose 컴파일러 플러그인과 반드시 일치해야 하며,
# AGP 를 올리면 이 값도 함께 확인해야 한다.
kotlinBundled = "2.3.20"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycleCompose = "2.11.0"
# --- Firebase (FCM, P4) ---
# google-services 플러그인은 app/google-services.json 을 읽어 리소스를 생성한다.
# 파일이 없으면 빌드가 실패하므로 플러그인과 파일은 항상 같이 있어야 한다.
googleServices = "4.5.0"
firebaseBom = "34.19.0"
# --- 위치 (출발·도착 판별) ---
# FusedLocationProvider. 플랫폼 LocationManager 대신 이걸 쓰는 이유는
# GPS·WiFi·셀을 합쳐 주고 배터리 정책을 알아서 처리하기 때문이다. 아침 한 번의
# 이동을 따라가는 동안 화면이 꺼져 있어도 fix 가 끊기지 않아야 한다.
# Play Services 는 firebase-messaging 이 이미 끌어오므로 새 런타임 의존은 아니다.
playServicesLocation = "21.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

# lifecycle / coroutines
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# network
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttpLogging" }

# compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleCompose" }

# firebase. BOM 이 나머지 firebase 아티팩트 버전을 고정하므로 개별 버전을 쓰지 않는다.
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }

# 위치
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Compose 컴파일러. AGP 9.3.2 내장 Kotlin(2.3.20)과 버전을 맞춰야 한다.
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinBundled" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
