# Render 배포 청사진(Blueprint).
#
# 이 파일이 있으면 Render 에서 저장소를 연결할 때 서비스·DB·환경변수를 자동으로
# 만든다. 대시보드에서 손으로 채우는 항목을 줄이려는 것이다.
#
# 쓰는 법은 docs/team-setup.md 를 볼 것.
#
# **Render 에 묶이지 않는다.** 실제 실행은 backend/Dockerfile 이 하므로
# Railway·Fly·연구실 리눅스 서버로 옮길 때 이 파일만 버리면 된다.

services:
  - type: web
    name: justintime-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    branch: main

    # 무료 플랜은 15분 무응답이면 잠든다. 다시 깨는 데 30~60초 걸린다.
    # 팀원이 "로그인이 안 된다" 고 할 때 대개 이것이다. 잠들지 않게 하려면
    # 유료 플랜(Starter)으로 올려야 한다.
    healthCheckPath: /api/health

    envVars:
      # Render 가 무작위로 생성한다. 개발용 키를 재사용하지 않는다.
      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod

      # Neon Postgres 접속 문자열. **대시보드에서 직접 넣는다.**
      #
      # Render 자체 Postgres 를 쓰지 않는다. 무료 플랜이 생성 30일 후 만료돼
      # 학기 중에 데이터가 사라진다. Neon 무료 티어는 만료가 없다.
      #
      # **`-pooler` 없는 direct 주소를 넣는다.** 이 컨테이너는 시작할 때
      # migrate 를 돌린 뒤 gunicorn 을 띄우므로(backend/Dockerfile) 이 값
      # 하나가 마이그레이션과 앱 런타임을 겸한다. pooler(PgBouncer 트랜잭션
      # 모드)는 PREPARE 같은 세션 기능이 없어 마이그레이션이 깨질 수 있다.
      #
      # pooler 는 연결 고갈을 푸는 도구인데 우리는 그 문제가 없다 - 워커 2개에
      # conn_max_age=600 이라 동시 연결이 2개 수준이고, Neon direct 한도는
      # 0.25 CU 에서 약 104개다.
      - key: DATABASE_URL
        sync: false

      # Render 가 배포 도메인을 RENDER_EXTERNAL_HOSTNAME 으로 주고
      # prod.py 가 그것을 ALLOWED_HOSTS 에 더한다. 커스텀 도메인을 붙이면
      # 여기에 쉼표로 추가한다.
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"

      - key: WEB_CONCURRENCY
        value: "2"

      # 카카오 경로·장소 검색 키. **대시보드에서 직접 넣는다.**
      # 이 파일에 적으면 저장소에 시크릿이 들어간다.
      - key: KAKAO_REST_API_KEY
        sync: false

      # 실시간 대중교통 도착정보. 값은 저장소에 넣지 않고 Render 대시보드에서
      # 직접 넣는다. 로컬 backend/.env 는 Render 컨테이너에 올라가지 않는다.
      # 버스는 data.go.kr 이 보여 주는 Encoding/Decoding 두 표현을 모두 둔다.
      - key: SEOUL_BUS_API_KEY_ENCODING
        sync: false

      - key: SEOUL_BUS_API_KEY_DECODING
        sync: false

      - key: SEOUL_SUBWAY_API_KEY
        sync: false

# databases 블록을 두지 않는다.
#
# 여기에 Render Postgres 를 정의하면 DATABASE_URL 이 그쪽으로 자동 연결되고,
# Neon 에 이관한 데이터가 보이지 않는다. 실제로 그렇게 배포돼서 이관한 데모
# 계정으로 로그인이 안 됐다 - health 는 200 이었으므로 한참 뒤에 발견했다.
#
# DB 는 Neon 을 쓴다. DATABASE_URL 을 대시보드에서 직접 넣는다.
