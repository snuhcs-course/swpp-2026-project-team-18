# JustInTime 지속 통합.
#
# ## 왜 필요한가
#
# 지금까지 모든 검증(백엔드 pytest, 앱 단위 테스트, 앱-서버 계약 검사)이 한
# 사람의 PC 에서만 돌았다. 그러면 두 가지가 깨진다.
#
# 1. **깨진 것을 나중에 안다.** push 한 사람이 자기 부분만 돌리고 넘어가면
#    백엔드 변경이 앱 계약을 깬 것을 다음 사람이 발견한다.
# 2. **"내 PC 에서는 됩니다".** 커밋되지 않은 `.env`·`local.properties` 에 기대는
#    코드가 섞여 들어가도 아무도 모른다. 이 워크플로는 그 파일들이 **없는**
#    상태로 돌기 때문에 그 의존을 즉시 드러낸다.
#
# ## 잡을 넷으로 나눈 이유
#
# 실패 원인을 한 줄로 읽을 수 있어야 한다. 하나로 합치면 "CI 실패" 만 보이고
# 로그를 열어야 백엔드인지 앱인지 알 수 있다. 넷은 서로 독립이라 병렬로 돈다.
#
# ## 비밀값을 쓰지 않는다
#
# `KAKAO_REST_API_KEY` 를 넣지 않는다. 무료 쿼터가 계정당 하루 단위라 CI 가
# 그것을 태우면 사람이 개발을 못 한다. 키가 없으면 경로 계산이 필요한 항목은
# 검사 스크립트가 **건너뛴다**(실패가 아니다).
#
# 그래서 이 워크플로에는 `secrets` 참조가 없고 권한도 읽기만 준다. 포크에서 온
# 풀 리퀘스트가 돌아도 가져갈 것이 없다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 새 푸시가 오면 진행 중인 실행을 취소한다. 러너 시간을 아끼는
# 것보다, "지금 초록불이 어느 커밋의 것인가" 가 헷갈리지 않는 쪽이 중요하다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 최소 권한. 이 워크플로는 저장소를 읽기만 한다.
permissions:
  contents: read

jobs:
  # =========================================================================
  # 백엔드 단위·통합 테스트
  # =========================================================================
  backend:
    name: 백엔드 pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # backend/Dockerfile 과 같은 버전
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: 의존성 설치
        run: pip install -r requirements/dev.txt

      # config/settings/test.py 가 DB 를 메모리 SQLite 로 고정하고 외부 API 키를
      # 빈 문자열로 덮는다. 그래서 환경변수를 하나도 주지 않는다 — 실수로 공용
      # DB 나 실제 키를 쓰게 되는 경로를 아예 만들지 않는 것이다.
      #
      # 커버리지를 함께 잰다(.coveragerc). 테스트 문서(Wiki)의 "계층별 목표 vs
      # 실제" 표는 이 잡의 요약을 옮긴 것이다. 로컬에서 같은 숫자를 보려면 같은
      # 두 명령을 돌린다.
      - name: pytest · 커버리지
        run: python -m pytest --cov --cov-report=term --cov-report=html --cov-report=json

      - name: 커버리지 요약
        run: |
          echo "## 백엔드 줄 커버리지" >> "$GITHUB_STEP_SUMMARY"
          python scripts/coverage_summary.py >> "$GITHUB_STEP_SUMMARY"

      # 통합 = 테스트 클라이언트로 HTTP 요청을 보내는 테스트(backend/conftest.py).
      # 표시가 실제와 다르면 위 pytest 가 이미 실패하므로 이 개수는 믿어도 된다.
      - name: 단위·통합 개수
        run: |
          count() { python -m pytest -q --collect-only -m "$1" | tail -1 | sed -E 's#^([0-9]+)/.*#\1#'; }
          {
            echo "## 백엔드 테스트 수"
            echo "| 구분 | 테스트 |"
            echo "| --- | ---: |"
            echo "| 단위 (\`-m \"not integration\"\`) | $(count 'not integration') |"
            echo "| 통합 (\`-m integration\`) | $(count integration) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 커버리지 리포트 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/htmlcov/
          retention-days: 14
          if-no-files-found: ignore

  # =========================================================================
  # 앱-서버 계약 검사 (살아 있는 서버 상대)
  # =========================================================================
  #
  # pytest 가 못 잡는 것을 잡는다 — URL 이 실제로 연결됐는지, 직렬화가 앱이 읽는
  # 모양인지, 권한이 붙어 있는지. Django 테스트 클라이언트는 라우팅 누락이나
  # 미들웨어 차이를 통과시킬 수 있다.
  contract:
    name: 앱-서버 계약 검사
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: 의존성 설치
        run: pip install -r requirements/dev.txt

      # 러너 스크립트가 서버 기동·DB 고정·포트 확인을 전부 한다. 절차를 여기에
      # 베껴 쓰지 않는 이유는 팀원이 자기 PC 에서 **같은 것**을 돌려야 하기
      # 때문이다: cd backend && python scripts/run_local_suite.py
      - name: 로컬 회귀 스위트
        run: python scripts/run_local_suite.py

      - name: 서버 로그 남기기
        if: failure()
        run: cat /tmp/jit_local_suite_server.log || true

  # =========================================================================
  # 안드로이드 앱
  # =========================================================================
  android:
    name: 앱 단위 테스트 · 디버그 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APP
    steps:
      - uses: actions/checkout@v4

      # JDK 두 개를 깐다.
      #   25 — Gradle 데몬. gradle/gradle-daemon-jvm.properties 가 요구한다.
      #   21 — AGP 가 쓰는 컴파일 툴체인.
      # 마지막 항목이 JAVA_HOME 이 되므로 25 를 뒤에 둔다. 21 을 함께 까는
      # 이유는 foojay 자동 내려받기(약 190MB)를 매 실행마다 하지 않으려는 것이다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      # compileSdk/targetSdk 37 이라 플랫폼을 직접 깐다. 패키지 이름은 구글
      # 저장소 목록에서 확인한 것이다 — 37 부터 `android-37.0` 처럼 소수점이
      # 붙어서 `android-37` 로 쓰면 없는 패키지가 된다.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      # local.properties 가 없다(커밋되지 않는다). 그러면 sdk.dir 은 setup-android
      # 가 넣은 ANDROID_HOME 에서, 서버 주소는 gradle.properties 의
      # jitApiBaseUrl 에서 온다. 이 폴백이 깨지면 여기서 잡힌다.
      #
      # lint 를 함께 돌린다. **오류만 막고 경고는 통과시킨다** — 지금 경고가
      # 57건이고, 처음부터 노란불이 섞이면 아무도 보지 않는다. 오류 쪽은
      # MissingPermission·WrongThread 처럼 실제 크래시가 되는 것들이라 막을
      # 가치가 있다(실제로 3건을 이 검사로 찾아 고쳤다).
      #
      # jacocoDebugUnitTestReport 가 testDebugUnitTest 를 돌리고 커버리지 리포트를
      # 만든다(app/build.gradle.kts). 테스트를 두 번 돌리지 않는다.
      - name: 단위 테스트 · 커버리지 · lint · 디버그 빌드
        run: >-
          ./gradlew testDebugUnitTest jacocoDebugUnitTestReport lintDebug assembleDebug --console=plain
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

      # 리포트가 비어 있으면(클래스 경로가 틀림) 이 단계가 실패한다.
      - name: 커버리지 요약
        run: |
          echo "## 앱 줄 커버리지 (JVM 단위 테스트)" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/coverage_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: 커버리지 리포트 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-coverage
          path: APP/app/build/reports/jacoco/
          retention-days: 14
          if-no-files-found: ignore

      # 실패했을 때 어느 테스트가 깨졌는지 보려면 리포트가 필요하다. 로그만
      # 보고는 Compose·Gradle 출력에 묻힌다.
      - name: 테스트·lint 리포트 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-report
          path: |
            APP/app/build/reports/tests/
            APP/app/build/test-results/
            APP/app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: ignore

  # =========================================================================
  # 안드로이드 앱 — 기기 통합 테스트 (에뮬레이터)
  # =========================================================================
  #
  # 화면·Room 캐시처럼 JVM 에서는 돌지 않는 것을 실제 안드로이드에서 돌린다.
  # 모든 PR 에서 돈다(2026-10-16 팀 결정). 시간이 가장 오래 걸리는 잡이라 단위
  # 테스트 잡과 나눠 두었다 — 단위 테스트 실패는 이 잡을 기다리지 않고 보인다.
  #
  # `com.swpp.wakeup.integration` 패키지만 돌린다. 같은 폴더의 E2E 테스트
  # (DemoFlowTest 등)는 QA 빌드와 재생 서버가 있어야 해서 `qa/demo/run.py` 가
  # 따로 돌린다. 통합 테스트는 서버를 부르지 않는다(가짜 API 와 기기 DB 만 쓴다).
  #
  # API 34 는 minSdk 다. 지원하는 가장 낮은 버전에서 돌아야 그 아래 기능을 실수로
  # 쓴 것이 잡힌다.
  android-integration:
    name: 앱 통합 테스트 (에뮬레이터)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: APP
    steps:
      - uses: actions/checkout@v4

      # 단위 테스트 잡과 같은 JDK 구성이다(이유는 위 android 잡 주석).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      # 에뮬레이터 하드웨어 가속. 없으면 소프트웨어 에뮬레이션이라 부팅만 수십 분이다.
      - name: KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 에뮬레이터를 켜기 전에 APK 를 만든다. 켠 뒤에 빌드하면 그 시간 동안
      # 에뮬레이터가 놀면서 러너 메모리를 차지한다.
      - name: 앱·테스트 APK 빌드
        run: >-
          ./gradlew assembleDebug assembleDebugAndroidTest --console=plain
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

      - name: 기기 통합 테스트
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: APP
          script: ./gradlew connectedDebugAndroidTest --console=plain -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64 -Pandroid.testInstrumentationRunnerArguments.package=com.swpp.wakeup.integration

      - name: 통합 테스트 리포트 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-integration-test-report
          path: |
            APP/app/build/reports/androidTests/connected/
            APP/app/build/outputs/androidTest-results/connected/
          retention-days: 7
          if-no-files-found: ignore
