; pytest 설정.
;
; 실행:
;   cd backend
;   .\.venv\Scripts\python.exe -m pytest
;
; `scripts/check_*.py` 와 역할이 다르다. 그쪽은 **살아 있는 서버**에 HTTP 로
; 붙어 기능을 확인한다(배포 검증). 이쪽은 프로세스 안에서 계산과 권한을
; 검증한다. 서버가 안 떠 있어도 돌고, 외부 API 를 부르지 않는다.

[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
; apps 아래만 본다. .venv 의 서드파티 테스트를 긁어오면 수천 건이 잡힌다.
testpaths = apps
; -ra  : 건너뛴 이유까지 요약에 남긴다
; --strict-markers : 오타 난 마커를 조용히 무시하지 않는다
addopts = -ra --strict-markers --tb=short
filterwarnings =
    error::DeprecationWarning:apps.*
